<main class="page-shell">
  <section class="panel">
    <aside class="sidebar">
      <div class="brand-wrap">
        <div class="brand-icon">F</div>
        <div>
          <p class="brand-tag">Servicio técnico</p>
          <h2>FixFlow</h2>
        </div>
      </div>

      <nav class="nav" aria-label="Navegación principal">
        <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
        <a class="nav-item" routerLink="/landing" routerLinkActive="active">Demo</a>
        <a class="nav-item" routerLink="/clientes" routerLinkActive="active">Clientes</a>
        <a class="nav-item" routerLink="/ordenes" routerLinkActive="active">Órdenes</a>
        <a class="nav-item" routerLink="/reportes" routerLinkActive="active">Reportes</a>
      </nav>

      <div class="sidebar-box">
        <span>Turno</span>
        <strong>Activo</strong>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Technical Service</p>
          <h1>Gestión de reparaciones</h1>
        </div>
        <div class="header-actions">
          <span class="status-pill">Sistema en línea</span>
        </div>
      </header>

      <router-outlet></router-outlet>
    </div>
  </section>
</main>
